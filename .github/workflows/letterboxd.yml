name: Sync Letterboxd Diary

on:
  # Daily, at 08:17 UTC. GitHub may delay scheduled jobs.
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  # Run when this workflow is first added or edited.
  push:
    paths:
      - ".github/workflows/letterboxd.yml"

permissions:
  contents: write

concurrency:
  group: letterboxd-diary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-diary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch full public Letterboxd diary and publish CSV
        uses: nichtlegacy/letterboxd-graph@8699a1602134f2e4b1dd127b766ab733b39d7786
        with:
          username: kennypickettfan
          scope: "all"
          years: "last 2"
          review-years: "last 2"
          month-cards: "0"
          commit: "false"

      - name: Export all watched films, including those without diary entries
        run: |
          python3 -m pip install beautifulsoup4
          python3 scripts/sync_watched.py

      - name: Commit refreshed diary and full watched list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Update Letterboxd diary and watched films"
            git push origin HEAD:main
          fi
